name: Loop 1 CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.paths.outputs.go }}
      java: ${{ steps.paths.outputs.java }}
      web: ${{ steps.paths.outputs.web }}
      desktop: ${{ steps.paths.outputs.desktop }}
      mobile: ${{ steps.paths.outputs.mobile }}
      shared: ${{ steps.paths.outputs.shared }}
      old_client: ${{ steps.paths.outputs.old_client }}
      plugin: ${{ steps.paths.outputs.plugin }}
      migration: ${{ steps.paths.outputs.migration }}
      compatibility: ${{ steps.paths.outputs.compatibility }}
      deploy: ${{ steps.paths.outputs.deploy }}
      architecture: ${{ steps.paths.outputs.architecture }}
      source_go: ${{ steps.paths.outputs.source_go }}
      source_java: ${{ steps.paths.outputs.source_java }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Diagnose checkout status
        shell: pwsh
        run: |
          $status = @(git -c core.excludesFile=.git/info/exclude status --porcelain=v1 --untracked-files=all 2>&1)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "checkout_status_entries=$($status.Count)"
          foreach ($entry in $status) { Write-Host "checkout_status=$entry" }
      - name: Verify clean repository recovery
        shell: pwsh
        run: ./tools/verify-loop1-ctrl-002.ps1 -Mode Acceptance
      - name: Test path matrix
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/ci -v
      - name: Classify full diff, including deletions
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base=$(git hash-object -t tree /dev/null)
          fi
          python3 ci/classify.py --base "$base" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  architecture:
    needs: classify
    if: needs.classify.outputs.architecture == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical integrity and authority structure
        shell: pwsh
        run: ./tools/verify-frozen-architecture.ps1
      - name: Current governance references and task scopes
        run: python3 ci/check_architecture.py --scope governance
      - name: Active client technology/source/dependency/configuration guard
        run: python3 ci/check_architecture.py --scope clients --json
      - name: Checker positive and negative controls
        run: python3 -m unittest discover -s tests/architecture -v

  source_go:
    needs: classify
    if: needs.classify.outputs.source_go == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Real Go source ownership and AST dependency graph
        run: python3 ci/check_architecture.py --scope go --json

  source_java:
    needs: classify
    if: needs.classify.outputs.source_java == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Java current source and explicit placeholder boundary
        run: python3 ci/check_architecture.py --scope java --json

  go:
    needs: classify
    if: needs.classify.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: im_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d im_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: im_ci
      DB_TEST_ENABLE: '1'
      NATS_URL: nats://localhost:4222
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go/go.sum
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Migrate canonical schema
        run: python3 contracts/database/migrate.py up
      - name: Go Auth build, integration and contract verification
        run: |
          test -z "$(find backend/go -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
          cd backend/go
          go build ./...
          go build -o "$RUNNER_TEMP/im-go" .
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...
          cd ../..
          python3 contracts/websocket/verify.py
          pwsh -NoProfile -File contracts/http/verify-auth-user-friend.ps1

  java:
    needs: classify
    if: needs.classify.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Java S0 compile
        run: |
          python3 ci/check_s0_boundary.py java
          javac -d "$RUNNER_TEMP" backend/java/InfraPlaceholder.java

  web:
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web S0 skeleton boundary
        run: python3 ci/check_s0_boundary.py web

  desktop:
    needs: classify
    if: needs.classify.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Tauri prerequisites and approved Rust compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Actual TypeScript Repository on SQLx SQLite
        if: runner.os == 'Linux'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/client-sqlite-target
        run: |
          python3 -B tools/verify_client_sqlite.py --scope desktop
          python3 -B tools/verify_client_send.py --scope desktop
          python3 -B tools/verify_client_sync.py --scope desktop
          python3 -B tests/clients/sync/go_smoke.py --probe "$CARGO_TARGET_DIR/debug/storage_probe"
      - name: Approved Windows GUI assembly and auth controls
        if: runner.os == 'Windows'
        shell: pwsh
          env:
            CARGO_TARGET_DIR: ${{ runner.temp }}/client-gui-target
        run: |
          npm --prefix clients/desktop ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix clients/desktop run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/clients/gui/auth.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path clients/desktop/src-tauri/Cargo.toml --locked --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location clients/desktop
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS='-C link-arg=/SUBSYSTEM:WINDOWS -C link-arg=/ENTRY:mainCRTStartup'
          npm run tauri -- build --target x86_64-pc-windows-msvc --debug --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

  mobile:
    needs: classify
    if: needs.classify.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable hosted Linux KVM permissions
        run: |
          id
          if [[ ! -c /dev/kvm ]]; then
            printf '%s\n' 'ERROR: /dev/kvm is missing or is not a character device.' >&2
            exit 1
          fi
          stat --format='KVM before: %F %a %U:%G' /dev/kvm
          printf '%s\n' 'Granting disposable runner user read/write access to the existing KVM device.'
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 0600 /dev/kvm
          stat --format='KVM after: %F %a %U:%G' /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            printf '%s\n' 'ERROR: current runner user cannot read and write /dev/kvm.' >&2
            exit 1
          fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: false
          pre-emulator-launch-script: '$ANDROID_HOME/emulator/emulator -accel-check'
          script: |
            python3 -B tools/verify_client_sqlite.py --scope mobile --serial emulator-5554
            python3 -B tools/verify_client_send.py --scope mobile --serial emulator-5554
            python3 -B tools/verify_client_sync.py --scope mobile --serial emulator-5554
            python3 -B tests/clients/gui/android.py --serial emulator-5554

  shared:
    needs: classify
    if: needs.classify.outputs.shared == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual shared TypeScript storage compile
        run: |
          python3 -B tools/verify_client_sqlite.py --scope shared
          python3 -B tools/verify_client_send.py --scope shared
          python3 -B tools/verify_client_sync.py --scope shared
      - name: HTTP, WSS, Sync and Plugin contracts
        shell: pwsh
        run: |
          ./contracts/http/verify-auth-user-friend.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 -B tools/verify_sync_transport.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 -B -m unittest discover -s tests/contract -p test_sync_transport.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 contracts/websocket/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 contracts/plugin-api/verify.py
          exit $LASTEXITCODE

  compatibility:
    needs: classify
    if: needs.classify.outputs.compatibility == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: im_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d im_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: im_ci
      PYTHONDONTWRITEBYTECODE: '1'
      DB_TEST_ENABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Shared fixture compatibility and migration
        run: |
          python3 contracts/websocket/verify.py
          python3 contracts/plugin-api/verify.py
          python3 -m unittest discover -s tests/database -v
      - name: Current client source and remaining Web skeleton boundary
        run: |
          python3 ci/check_s0_boundary.py web
          python3 ci/check_architecture.py --scope clients --json

  deploy:
    needs: classify
    if: needs.classify.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable Go profile configuration
        shell: pwsh
        env:
          IM_GO_CONFIG_DIR: ${{ runner.temp }}/im-go-config
        run: |
          New-Item -ItemType Directory -Path $env:IM_GO_CONFIG_DIR -Force | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "IM_GO_CONFIG_DIR=$env:IM_GO_CONFIG_DIR"
          Copy-Item backend/go/config.example.json (Join-Path $env:IM_GO_CONFIG_DIR 'config.json')
          [System.IO.File]::WriteAllText((Join-Path $env:IM_GO_CONFIG_DIR 'pg_password'), 'local-development-only')
          $key = [Convert]::ToBase64String([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(48))
          [System.IO.File]::WriteAllText((Join-Path $env:IM_GO_CONFIG_DIR 'jwt_key'), $key)
      - name: Validate both Compose profiles
        run: |
          docker compose -f deploy/compose.yaml --profile go config --quiet
          docker compose -f deploy/compose.yaml --profile java config --quiet
      - name: Frozen architecture integrity
        shell: pwsh
        run: ./tools/verify-frozen-architecture.ps1
      - name: Go transport smoke
        shell: pwsh
        run: ./tests/infrastructure/smoke.ps1 -Profile go
      - name: Go Auth actual roles and TLS event smoke
        run: python3 tests/go/live_role_smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Current shared Sync client actual Go TLS runtime
        run: python3 -B tests/clients/sync/go_smoke.py
      - name: Go public Sync strict TLS runtime
        run: python3 -B tools/verify_sync_runtime.py
      - name: Go S1 strict TLS messaging E2E
        run: python3 -B tests/e2e/go_tls_messaging.py
      - name: Java transport smoke
        shell: pwsh
        run: ./tests/infrastructure/smoke.ps1 -Profile java

  gate:
    if: always()
    needs: [classify, architecture, source_go, source_java, go, java, web, desktop, mobile, shared, compatibility, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected job to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 ci/check_gate.py
